:root{--paper:#faf5eb;--ink:#343f33;--gold:#a27b40}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}button,input{font:inherit}button,a{touch-action:manipulation}nav{display:flex;justify-content:space-between;align-items:center;padding:22px 6%;border-bottom:1px solid #a27b4033;font-size:12px;letter-spacing:2px}button,.button{background:transparent;border:1px solid var(--gold);padding:12px 22px;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;letter-spacing:1px;font-size:12px}button:hover,.button:hover{background:#e9dfcb}main{text-align:center}.hero{min-height:85vh;padding:65px 20px;display:grid;place-content:center;position:relative;overflow:hidden}.arch{border:1px solid #a27b4060;border-radius:220px 220px 0 0;padding:75px 55px 60px;max-width:650px;margin:auto;position:relative}.arch:before{content:'✦';position:absolute;top:20px;left:0;right:0;color:var(--gold);font-size:30px}.eyebrow{font-family:Arial,sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);line-height:1.9}h1{font-weight:400;font-size:clamp(42px,8vw,85px);line-height:1.15;margin:28px 0}h1 em{display:block;color:var(--gold);font-size:35px;margin:12px;font-weight:400}p{line-height:1.9;font-size:16px}.date{letter-spacing:3px;margin-top:32px}.floral{position:absolute;font-size:200px;color:#79867115;transform:rotate(25deg);pointer-events:none;left:-30px;bottom:0}.floral.right{left:auto;right:-30px;top:0;bottom:auto;transform:rotate(-30deg)}section{padding:70px 6%;max-width:1100px;margin:auto}h2{font-size:40px;font-weight:400;margin:15px 0 30px}.divider{color:var(--gold);letter-spacing:15px}.events{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:40px}.event{padding:30px 18px;border:1px solid #a27b4038}.event h3{font-size:25px;font-weight:400}.event p{font-size:14px}.event .symbol{font-size:25px;color:var(--gold)}.venue{background:#eef0e7;max-width:none}.venue-inner{max-width:750px;margin:auto}.note{font-style:italic;font-size:22px;max-width:600px;margin:20px auto}.countdown{display:flex;justify-content:center;gap:25px;margin:30px 0}.countdown span{font-size:30px}.countdown small{display:block;font-size:9px;font-family:Arial,sans-serif;letter-spacing:2px;margin-top:10px}footer{text-align:center;padding:40px;border-top:1px solid #a27b4033;font-size:13px}dialog{border:1px solid var(--gold);background:var(--paper);color:var(--ink);max-width:570px;width:92%;max-height:90vh;padding:30px}dialog::backdrop{background:#20302088}form{display:grid;gap:15px}label{text-align:left;font-family:Arial,sans-serif;font-size:12px;line-height:1.7}input{display:block;width:100%;padding:10px;border:1px solid #a27b4055;background:#fffdf8;margin-top:4px}.hint{font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}.template-badge{background:#eae1cf;text-align:center;padding:10px;font:11px Arial,sans-serif;letter-spacing:1px}.hidden{display:none!important}@media(max-width:750px){.events{grid-template-columns:1fr 1fr}.arch{padding:65px 22px 40px}.hero{min-height:75vh}section{padding:50px 20px}nav{letter-spacing:1px}.countdown{gap:18px}}@media(prefers-reduced-motion:no-preference){.arch{animation:appear 1.2s ease both}@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}}

.celebration-confetti{position:absolute;inset:-18px;pointer-events:none;overflow:visible;z-index:2}.celebration-confetti i{position:absolute;display:block;opacity:0;left:var(--x);top:var(--y);width:6px;height:11px;background:var(--c);border-radius:1px}.celebration-confetti i.sparkle{width:auto;height:auto;background:none;color:var(--c);font:17px Georgia,serif}.event.celebrating .celebration-confetti i{animation:confetti-celebrate 1.8s var(--delay) ease-out infinite}@keyframes confetti-celebrate{0%{opacity:0;transform:translate(0,12px) rotate(0deg) scale(.5)}20%{opacity:1}70%{opacity:.9}100%{opacity:0;transform:translate(var(--drift),-75px) rotate(var(--spin)) scale(1)}}@media(prefers-reduced-motion:reduce){.event.celebrating .celebration-confetti i{animation:none}}

.celebration-confetti i.turmeric-petal{width:10px;height:15px;border-radius:80% 10% 80% 10%}.celebration-confetti i.rose-petal{width:13px;height:16px;border-radius:70% 20% 65% 35%}.celebration-confetti i.music-note{width:auto;height:auto;background:none;font-size:24px;color:var(--c)}.celebration-confetti i.rice-grain{width:3px;height:9px;border-radius:90%;box-shadow:0 0 1px #a27b40}.event.celebrating .theme-wedding i{animation-name:petal-shower;animation-duration:2.7s}.event.celebrating .theme-tilak i{animation-name:rice-blessing;animation-duration:2.2s}.event.celebrating .theme-sangeet i{animation-name:music-dance;animation-duration:1.7s}.henna-vines{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);opacity:0}.henna-vines path{stroke-dasharray:100;stroke-dashoffset:100}.event.celebrating .henna-vines{opacity:.65}.event.celebrating .henna-vines path{animation:henna-draw 2.8s ease-in-out infinite}.tilak-mark{position:absolute;left:calc(50% - 4px);top:23px;width:8px;height:23px;background:#b34835;border-radius:6px;opacity:0}.event.celebrating .tilak-mark{animation:tilak-glow 1.8s ease-in-out infinite}.music-waves{position:absolute;bottom:8px;left:calc(50% - 22px);height:20px;display:flex;align-items:center;gap:5px;opacity:0}.music-waves b{width:4px;height:16px;border-radius:2px;background:#a27b40}.event.celebrating .music-waves{opacity:.65}.event.celebrating .music-waves b{animation:music-beat .65s ease-in-out infinite alternate}@keyframes henna-draw{0%{stroke-dashoffset:100;opacity:0}20%{opacity:1}70%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}@keyframes petal-shower{0%{opacity:0;transform:translate(0,-45px) rotate(0)}15%,70%{opacity:.85}100%{opacity:0;transform:translate(var(--drift),65px) rotate(var(--spin))}}@keyframes rice-blessing{0%{opacity:0;transform:translate(0,-25px) rotate(20deg)}20%,60%{opacity:.9}100%{opacity:0;transform:translate(var(--drift),40px) rotate(90deg)}}@keyframes music-dance{0%{opacity:0;transform:translate(0,15px) rotate(-12deg)}25%{opacity:1;transform:translate(8px,-10px) rotate(12deg)}65%{opacity:.9;transform:translate(-8px,-35px) rotate(-12deg)}100%{opacity:0;transform:translate(var(--drift),-65px) rotate(12deg)}}@keyframes music-beat{from{transform:scaleY(.3)}to{transform:scaleY(1)}}@keyframes tilak-glow{0%,100%{opacity:.2;box-shadow:0 0 0 0 #d4ad5300}50%{opacity:.9;box-shadow:0 0 18px 6px #d4ad5344}}@media(prefers-reduced-motion:reduce){.event.celebrating .celebration-confetti i,.event.celebrating .henna-vines path,.event.celebrating .tilak-mark,.event.celebrating .music-waves b{animation:none}}

.event.wedding-event{overflow:hidden;isolation:isolate;padding:42px 28px 44px;min-height:330px;background:radial-gradient(ellipse at 50% 20%,#fff6df 0%,#f2e1bc 50%,#e6caa0 100%);border:1px solid #b78e4e;box-shadow:inset 0 0 0 7px #fff7e94d,inset 0 0 0 8px #b78e4e55}.wedding-event:before{content:'';position:absolute;inset:15px;border:1px solid #a27b4070;border-radius:120px 120px 4px 4px;pointer-events:none;z-index:-1}.wedding-event:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,#fff9e980 48%,transparent 60%);transform:translateX(-120%);z-index:0}.wedding-event>*{position:relative;z-index:1}.wedding-event .wedding-kicker{font:10px Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#90682e;margin:12px 0 0}.wedding-event h3{font-size:clamp(36px,6vw,54px);margin:12px 0;color:#74492f}.wedding-event p{font-size:16px;margin:12px 0}.wedding-event .wedding-blessing{font-style:italic;font-size:14px;color:#8d6247}.wedding-event .mandap-art{display:block;width:154px;height:104px;margin:0 auto;color:#a27b40}.wedding-event .mandap-art .flame{transform-origin:80px 83px}.wedding-event .garland{position:absolute;top:27px;bottom:22px;width:22px;display:flex;flex-direction:column;justify-content:space-around;align-items:center;pointer-events:none}.wedding-event .garland.left{left:28px}.wedding-event .garland.right{right:28px}.garland span{font-size:20px;color:#bf753e;line-height:1;text-shadow:0 1px 0 #fff5db}.garland span:nth-child(3n){color:#b56772}.garland span:nth-child(2n){color:#d6a33d}.wedding-event .celebration-confetti{position:absolute;inset:0;z-index:3}.event.wedding-event.celebrating{background:radial-gradient(ellipse at 50% 20%,#fff9e9 0%,#f5e4c2 50%,#e6caa0 100%)}.wedding-event.celebrating:after{animation:wedding-shimmer 3s ease-in-out infinite}.wedding-event.celebrating .flame{animation:sacred-flame .65s ease-in-out infinite alternate}.wedding-event.celebrating .garland{animation:garland-sway 2s ease-in-out infinite alternate;transform-origin:top center}.wedding-event.celebrating .garland.right{animation-direction:alternate-reverse}@keyframes wedding-shimmer{0%{transform:translateX(-120%)}65%,100%{transform:translateX(120%)}}@keyframes sacred-flame{from{transform:scale(.9,1);opacity:.75}to{transform:scale(1.12,1.15);opacity:1}}@keyframes garland-sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}@media(max-width:420px){.event.wedding-event{padding:38px 32px}.wedding-event .garland.left{left:8px}.wedding-event .garland.right{right:8px}.garland span{font-size:16px}.wedding-event .wedding-kicker{letter-spacing:2px}}@media(prefers-reduced-motion:reduce){.wedding-event.celebrating:after,.wedding-event.celebrating .flame,.wedding-event.celebrating .garland{animation:none}}
.parentage{display:block;font-size:clamp(13px,2.5vw,17px);line-height:1.6;letter-spacing:.3px;color:#806b50;margin-top:14px}.arch{max-width:720px}h1 em{margin:20px 12px}

#date,#city{font-family:'Montserrat',Arial,sans-serif;font-weight:700}#date{font-size:19px;letter-spacing:1.4px}#city{font-size:17px;letter-spacing:.5px}.note{font-family:'Great Vibes','Snell Roundhand',cursive;font-size:clamp(32px,5vw,44px);line-height:1.5}.event p,#address,#wedding-time{font-family:'Lora',Georgia,serif;font-weight:500;line-height:1.8}.event p{font-size:14px}.wedding-event p{font-size:17px}.guest-rsvp{max-width:480px;margin:28px auto 0;padding:28px;border:1px solid #a27b4055;border-radius:8px;background:#fffaf0;text-align:left}.guest-rsvp h3{font-family:'Lora',Georgia,serif;font-size:23px;font-weight:500;margin:0 0 5px}.guest-rsvp input,.guest-rsvp select{font-family:'Montserrat',Arial,sans-serif;font-size:14px}.guest-rsvp select{display:block;width:100%;padding:12px;margin-top:4px;border:1px solid #a27b4055;background:#fffdf8;color:var(--ink)}.guest-rsvp button{background:#eee1c7}.guest-rsvp .hint{margin:0;font-family:Arial,sans-serif;line-height:1.6}.guest-rsvp label{font-family:'Montserrat',Arial,sans-serif;font-weight:500}
body{background:#f6edda url('traditional-art.jpg') center top/cover fixed no-repeat}nav,footer{background:#fff9eddd}#rsvp-page>section{background:#fff9eddd;max-width:660px;margin:28px auto;padding:40px 35px;border:1px solid #b99a6055;border-radius:180px 180px 8px 8px;box-shadow:0 8px 35px #59422520}.guest-rsvp{background:#fffaf0ee}@media(max-width:750px){body{background-attachment:scroll;background-size:cover}#rsvp-page>section{margin:18px 20px;padding:35px 20px}} body{line-height:normal}a.button{border-radius:0}h1,h2,h3,p{color:inherit}
#rsvp-confirmation{text-align:center;border:1px solid var(--gold);border-radius:120px 120px 12px 12px;padding:48px 28px 30px;box-shadow:0 20px 80px #34281955}#rsvp-confirmation h2{font-family:'Great Vibes',cursive;font-size:clamp(40px,8vw,54px);margin:12px 0}#rsvp-confirmation p{font-family:'Lora',Georgia,serif;font-size:16px}#rsvp-confirmation::backdrop{background:#263325aa;backdrop-filter:blur(4px)}#rsvp-confirmation .confirmation-symbol{color:var(--gold);font-size:32px}#rsvp-confirmation button{background:#eee1c7;margin-top:12px}@media(prefers-reduced-motion:no-preference){#rsvp-confirmation[open]{animation:rsvp-welcome .5s ease-out}@keyframes rsvp-welcome{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}}</style></head><body><nav class="d-flex align-items-center"><span>Sanju &amp; Ankur</span><a class="button" href="sanju.html">Wedding invitation</a></nav><main id="rsvp-page" class="container-fluid p-0"><section><a class="button" href="sanju.html">← Back to invitation</a><div class="eyebrow" style="margin-top:35px">Sanju &amp; Ankur · 30 November 2026</div><h2>We saved you a place</h2><p>We look forward to celebrating with you.</p><form id="guest-rsvp" class="guest-rsvp d-grid"><h3>Your RSVP</h3><label>Your name<input class="form-control" name="guestName" autocomplete="name" required maxlength="100" placeholder="Full name"></label><label>Phone number<input class="form-control" name="guestPhone" type="tel" autocomplete="tel" required maxlength="25" pattern="[+0-9 ()-]{7,25}" placeholder="Your phone number"></label><label>Will you attend?<select class="form-select" name="attendance" required><option value="">Select an option</option><option value="Yes">Yes, I’ll be there</option><option value="No">No, I’m unable to attend</option></select></label><label>Additional guests (optional)<select class="form-select" name="additionalGuests"><option value="">Just me</option><option value="1">+1 guest</option><option value="2">+2 guests</option></select></label><button type="submit" id="guest-submit" disabled>Submit RSVP</button><p id="guest-help" class="hint">RSVP submissions will open once the guest list is connected.</p><p id="guest-status" class="hint" role="status"></p></form></section></main><footer>Sanju &amp; Ankur · 30 November 2026 · Bhiwani, Haryana</footer><dialog id="rsvp-confirmation" aria-labelledby="rsvp-confirmation-title" aria-describedby="rsvp-confirmation-message"><div class="confirmation-symbol" aria-hidden="true">✦</div><h2 id="rsvp-confirmation-title">We saved you a seat!</h2><p id="rsvp-confirmation-message"></p><button type="button" id="rsvp-confirmation-close" autofocus>With love, Sanju &amp; Ankur</button></dialog><script>
(() => {
  const endpoint = 'https://script.google.com/macros/s/AKfycbyLfDkMdwC2nyFneT_AYzbu09JB7o4-r0fxs-Au3_DdO9wP-inYzAxDd1kb_gbbyHQ/exec';
  const form = document.getElementById('guest-rsvp');
  const button = document.getElementById('guest-submit');
  const status = document.getElementById('guest-status');
  const frame = document.createElement('iframe');
  frame.name = 'rsvp-response';
  frame.title = 'RSVP submission response';
  frame.hidden = true;
  document.body.appendChild(frame);
  form.method = 'POST';
  form.target = frame.name;
  form.action = endpoint;
  const request = document.createElement('input');
  request.type = 'hidden'; request.name = 'requestId'; form.appendChild(request);
  const confirmation = document.getElementById('rsvp-confirmation');
  document.getElementById('rsvp-confirmation-close').addEventListener('click', () => confirmation.close());
  let pending = false, timer, lastFields = '', requestId = '';
  if (endpoint.startsWith('https://script.google.com/')) {
    button.disabled = false;
    document.getElementById('guest-help').textContent = 'Your response will be saved to our guest list.';
  }
  form.addEventListener('submit', event => {
    if (pending || !endpoint.startsWith('https://script.google.com/')) { event.preventDefault(); return; }
    const fields = JSON.stringify([form.elements.guestName.value.trim(), form.elements.guestPhone.value.trim(), form.elements.attendance.value, form.elements.additionalGuests.value]);
    if (fields !== lastFields) { requestId = crypto.randomUUID(); lastFields = fields; }
    request.value = requestId;
    pending = true; button.disabled = true; status.textContent = 'Saving your RSVP…';
    timer = setTimeout(() => {
      pending = false; button.disabled = false;
      status.textContent = 'We could not confirm your RSVP was saved. Please retry; repeated attempts will not add duplicate responses.';
    }, 45000);
  });
  window.addEventListener('message', event => {
    const data = event.data;
    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(event.origin) || !pending || !data || data.type !== 'wedding-rsvp' || data.requestId !== requestId) return;
    clearTimeout(timer); pending = false;
    if (data.ok === true) {
      status.textContent = 'Thank you! Your RSVP has been saved.';
      button.textContent = 'RSVP saved';
      const attending = form.elements.attendance.value === 'Yes';
      document.getElementById('rsvp-confirmation-title').textContent = attending ? 'We saved you a seat!' : 'Thank you for letting us know';
      document.getElementById('rsvp-confirmation-message').textContent = attending
        ? (Number(form.elements.additionalGuests.value) > 0 ? 'We warmly welcome you and your guests to our wedding! We’ve saved seats for all of you. We can’t wait to celebrate together.' : 'We warmly welcome you to our wedding! A seat is saved just for you. We can’t wait to celebrate together.')
        : 'We’ll miss you on our special day. Thank you for your love and warm wishes — you’ll be in our hearts as we celebrate.';
      confirmation.showModal();
      form.querySelectorAll('input,select').forEach(input => { input.disabled = true; });
    } else {
      button.disabled = false; status.textContent = 'Your RSVP could not be saved. Please try again.';
    }
  });
})();

</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script></body></html>
